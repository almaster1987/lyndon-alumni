# Netlify configuration — VTSU Lyndon Alumni Council
# DORMANT: the live host is Cloudflare Pages (see the _headers file). Netlify is not
# currently wired up — this file is kept only as a backup/alternative deploy config.
# Static single-page site, no build step.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
